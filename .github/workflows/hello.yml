name: Frontend CI                 # ワークフローの名前

on:
  pull_request:                   # PR が作られた・更新されたときに動く

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # ① リポジトリのコードを取ってくる
      - name: コードを取得
        uses: actions/checkout@v4

      # ② Node.js をセットアップ（npm キャッシュも有効化）
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ③ 依存パッケージをインストール（CI 向けの厳密インストール）
      - name: 依存をインストール
        run: npm ci

      # ④ Lint（書き方チェック）
      - name: Lint
        run: npm run lint

      # ⑤ 型チェック（TypeScript の型が合っているか）
      - name: 型チェック
        run: npm run typecheck

      # ⑥ テスト（CI 用の実行）
      - name: テスト
        run: npm run test:ci